name: Ошибка / Bug report
description: Сообщить о воспроизводимой ошибке расширения, установки или feedback-bot.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Проверьте существующие Issues. Не публикуйте токены, cookies, персональные данные или детали уязвимостей. Для уязвимостей используйте SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - Userscript
        - Установка / обновление
        - Telegram feedback-bot
        - Документация
        - Другое
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или commit SHA
      placeholder: "v1.8.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Браузер, ОС и менеджер userscript; для бота — Node.js / способ запуска.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Наблюдать ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Обезличенные скриншоты или фрагменты логов без секретов.
  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил существующие Issues и удалил приватные данные из сообщения.
          required: true
